<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>텍스트 → PPT 변환기</title>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
    }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 24px;
      color: #a8d8ea;
      letter-spacing: 1px;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
    }
    .panel {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #0f3460;
    }
    .panel h2 {
      font-size: 1rem;
      margin-bottom: 14px;
      color: #a8d8ea;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 8px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      margin-bottom: 4px;
      color: #9ab;
    }
    .hint {
      font-size: 0.78rem;
      color: #567;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 240px;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4a80;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.88rem;
      resize: vertical;
      font-family: inherit;
      line-height: 1.7;
    }
    textarea:focus { outline: none; border-color: #a8d8ea; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    select, input[type="number"] {
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4a80;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.85rem;
      width: 100%;
    }
    select:focus, input:focus { outline: none; border-color: #a8d8ea; }

    .color-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="color"] {
      width: 40px;
      height: 34px;
      padding: 2px;
      background: #0f3460;
      border: 1px solid #1a4a80;
      border-radius: 6px;
      cursor: pointer;
    }
    .color-hex {
      font-size: 0.78rem;
      color: #9ab;
      font-family: monospace;
    }

    .section-divider {
      border: none;
      border-top: 1px solid #0f3460;
      margin: 14px 0;
    }

    .bg-section { margin-top: 2px; }
    .bg-controls {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-top: 4px;
    }
    .upload-btn {
      flex: 1;
      display: inline-block;
      background: #0f3460;
      border: 1px dashed #a8d8ea;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 0.83rem;
      color: #a8d8ea;
      transition: background 0.2s;
      text-align: center;
    }
    .upload-btn:hover { background: #1a4a80; }
    #bgFileInput { display: none; }
    .clear-bg-btn {
      background: #2a1a1a;
      border: 1px solid #a05050;
      border-radius: 8px;
      padding: 9px 12px;
      color: #e08080;
      font-size: 0.83rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .clear-bg-btn:hover { background: #3a2020; }
    .bg-info {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    #bgFileName {
      flex: 1;
      font-size: 0.78rem;
      color: #789;
    }
    .bg-color-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #9ab;
    }
    #bgColor {
      width: 32px;
      height: 26px;
      padding: 1px;
      background: #0f3460;
      border: 1px solid #1a4a80;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-download {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: linear-gradient(135deg, #0f3460, #533483);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .btn-download:hover { opacity: 0.85; }
    .btn-download:active { opacity: 0.7; }

    /* Preview */
    .preview-area { display: flex; flex-direction: column; }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 8px;
    }
    .preview-header h2 { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .slide-count {
      font-size: 0.8rem;
      color: #567;
      background: #0f3460;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .slides-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      max-height: calc(100vh - 160px);
    }
    .slides-wrapper::-webkit-scrollbar { width: 6px; }
    .slides-wrapper::-webkit-scrollbar-track { background: #0a1628; border-radius: 3px; }
    .slides-wrapper::-webkit-scrollbar-thumb { background: #1a4a80; border-radius: 3px; }

    .slide-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #0f3460;
      flex-shrink: 0;
    }
    .slide-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .slide-bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
    }
    /* No overlay when no image */
    .slide-bg.no-image + .slide-bg-overlay {
      display: none;
    }
    .slide-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 5% 7%;
    }
    .slide-verse {
      text-align: right;
      font-weight: 700;
      word-break: break-word;
      flex-shrink: 0;
    }
    .slide-body {
      text-align: right;
      word-break: break-word;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .slide-body p { margin: 0; }
    .slide-number {
      position: absolute;
      bottom: 6px;
      left: 10px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.35);
      z-index: 3;
      font-family: monospace;
    }
    .no-slides {
      color: #456;
      font-size: 0.85rem;
      text-align: center;
      padding: 60px 0;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .slides-wrapper { max-height: 600px; }
    }
  </style>
</head>
<body>
<h1>텍스트 → PPT 변환기</h1>
<div class="container">
  <!-- 왼쪽: 입력 + 설정 -->
  <div class="panel">
    <h2>텍스트 입력</h2>
    <p class="hint">빈 줄로 슬라이드를 구분합니다.<br>첫 번째 줄 = 성경 구절 표시 (상단), 나머지 = 본문 (하단)</p>
    <textarea id="inputText" placeholder="요한복음 3:16
하나님이 세상을 이처럼 사랑하사
독생자를 주셨으니

시편 23:1
여호와는 나의 목자시니
내게 부족함이 없으리로다"></textarea>

    <hr class="section-divider">

    <div class="controls">
      <div class="control-group">
        <label>폰트</label>
        <select id="fontSelect">
          <option value="Malgun Gothic">맑은 고딕</option>
          <option value="Gulim">굴림</option>
          <option value="Dotum">돋움</option>
          <option value="Batang">바탕</option>
          <option value="Gungsuh">궁서</option>
          <option value="NanumGothic">나눔고딕</option>
          <option value="NanumMyeongjo">나눔명조</option>
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Georgia">Georgia</option>
          <option value="Calibri">Calibri</option>
        </select>
      </div>
      <div class="control-group">
        <label>줄 간격</label>
        <select id="lineSpacing">
          <option value="1.0">1.0 — 좁게</option>
          <option value="1.2">1.2</option>
          <option value="1.5" selected>1.5 — 보통</option>
          <option value="1.8">1.8</option>
          <option value="2.0">2.0 — 넓게</option>
          <option value="2.5">2.5 — 매우 넓게</option>
        </select>
      </div>
      <div class="control-group">
        <label>구절 글자 크기 (pt)</label>
        <input type="number" id="verseFontSize" value="24" min="8" max="80">
      </div>
      <div class="control-group">
        <label>본문 글자 크기 (pt)</label>
        <input type="number" id="bodyFontSize" value="32" min="8" max="80">
      </div>
      <div class="control-group">
        <label>구절 색상</label>
        <div class="color-row">
          <input type="color" id="verseColor" value="#ffdd88">
          <span class="color-hex" id="verseColorHex">#ffdd88</span>
        </div>
      </div>
      <div class="control-group">
        <label>본문 색상</label>
        <div class="color-row">
          <input type="color" id="bodyColor" value="#ffffff">
          <span class="color-hex" id="bodyColorHex">#ffffff</span>
        </div>
      </div>
    </div>

    <hr class="section-divider">

    <div class="bg-section">
      <label>배경 이미지</label>
      <div class="bg-controls">
        <label class="upload-btn" for="bgFileInput">📁 이미지 선택 (JPG / PNG)</label>
        <input type="file" id="bgFileInput" accept="image/*">
        <button class="clear-bg-btn" onclick="clearBg()">✕ 제거</button>
      </div>
      <div class="bg-info">
        <span id="bgFileName">선택된 파일 없음</span>
        <div class="bg-color-row">
          <span>배경색</span>
          <input type="color" id="bgColor" value="#111111">
        </div>
      </div>
    </div>

    <button class="btn-download" onclick="downloadPPT()">⬇ PPT 다운로드</button>
  </div>

  <!-- 오른쪽: 미리보기 -->
  <div class="panel preview-area">
    <div class="preview-header">
      <h2>미리보기</h2>
      <span class="slide-count" id="slideCount">슬라이드 0개</span>
    </div>
    <div class="slides-wrapper" id="previewArea">
      <div class="no-slides">텍스트를 입력하면 미리보기가 표시됩니다.</div>
    </div>
  </div>
</div>

<script>
  let bgDataUrl = null;

  // ── 이벤트 리스너 ────────────────────────────────────────────
  document.getElementById('bgFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('bgFileName').textContent = file.name;
    const reader = new FileReader();
    reader.onload = ev => { bgDataUrl = ev.target.result; updatePreview(); };
    reader.readAsDataURL(file);
  });

  document.getElementById('verseColor').addEventListener('input', function() {
    document.getElementById('verseColorHex').textContent = this.value;
    updatePreview();
  });
  document.getElementById('bodyColor').addEventListener('input', function() {
    document.getElementById('bodyColorHex').textContent = this.value;
    updatePreview();
  });
  document.getElementById('bgColor').addEventListener('input', updatePreview);

  ['inputText','fontSelect','lineSpacing','verseFontSize','bodyFontSize'].forEach(id => {
    document.getElementById(id).addEventListener('input', updatePreview);
    document.getElementById(id).addEventListener('change', updatePreview);
  });

  function clearBg() {
    bgDataUrl = null;
    document.getElementById('bgFileInput').value = '';
    document.getElementById('bgFileName').textContent = '선택된 파일 없음';
    updatePreview();
  }

  // ── 텍스트 파싱 ──────────────────────────────────────────────
  function parseSlides(text) {
    return text.split(/\n{2,}/)
      .map(block => block.trim())
      .filter(block => block.length > 0)
      .map(block => {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        return { verse: lines[0] || '', body: lines.slice(1) };
      });
  }

  // ── 미리보기 ─────────────────────────────────────────────────
  function updatePreview() {
    const text      = document.getElementById('inputText').value;
    const font      = document.getElementById('fontSelect').value;
    const spacing   = parseFloat(document.getElementById('lineSpacing').value);
    const versePt   = parseInt(document.getElementById('verseFontSize').value) || 24;
    const bodyPt    = parseInt(document.getElementById('bodyFontSize').value) || 32;
    const verseCol  = document.getElementById('verseColor').value;
    const bodyCol   = document.getElementById('bodyColor').value;
    const bgCol     = document.getElementById('bgColor').value;

    const slides = parseSlides(text);
    const area   = document.getElementById('previewArea');
    document.getElementById('slideCount').textContent = `슬라이드 ${slides.length}개`;

    if (slides.length === 0) {
      area.innerHTML = '<div class="no-slides">텍스트를 입력하면 미리보기가 표시됩니다.</div>';
      return;
    }

    // PPT 슬라이드 너비: LAYOUT_WIDE = 13.33인치
    // 1pt = 1/72인치, 1인치 = 96px (screen)
    // 실제 슬라이드 px = 13.33 * 96 ≈ 1280px
    const previewWidth = area.clientWidth || 500;
    const scale = previewWidth / 1280;
    const versePx = versePt * (96 / 72) * scale;
    const bodyPx  = bodyPt  * (96 / 72) * scale;

    area.innerHTML = slides.map((slide, i) => {
      const bodyHtml = slide.body.map(line =>
        `<p style="line-height:${spacing};margin-bottom:${(spacing-1)*0.25}em;">${escHtml(line)}</p>`
      ).join('');

      let bgStyle, bgClass;
      if (bgDataUrl) {
        bgStyle = `background-image:url('${bgDataUrl}');background-size:cover;background-position:center;`;
        bgClass = '';
      } else {
        bgStyle = `background-color:${bgCol};`;
        bgClass = 'no-image';
      }

      return `
        <div class="slide-preview">
          <div class="slide-bg ${bgClass}" style="${bgStyle}"></div>
          <div class="slide-bg-overlay"></div>
          <div class="slide-content">
            <div class="slide-verse" style="
              font-family:'${font}',sans-serif;
              font-size:${versePx.toFixed(1)}px;
              color:${verseCol};
              line-height:${spacing};
            ">${escHtml(slide.verse)}</div>
            <div class="slide-body" style="
              font-family:'${font}',sans-serif;
              font-size:${bodyPx.toFixed(1)}px;
              color:${bodyCol};
            ">${bodyHtml}</div>
          </div>
          <span class="slide-number">${i+1} / ${slides.length}</span>
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── PPT 생성 ─────────────────────────────────────────────────
  async function downloadPPT() {
    const text = document.getElementById('inputText').value.trim();
    if (!text) { alert('텍스트를 입력해주세요.'); return; }

    const slides    = parseSlides(text);
    const font      = document.getElementById('fontSelect').value;
    const spacing   = parseFloat(document.getElementById('lineSpacing').value);
    const versePt   = parseInt(document.getElementById('verseFontSize').value) || 24;
    const bodyPt    = parseInt(document.getElementById('bodyFontSize').value) || 32;
    const verseCol  = document.getElementById('verseColor').value.replace('#','');
    const bodyCol   = document.getElementById('bodyColor').value.replace('#','');
    const bgCol     = document.getElementById('bgColor').value.replace('#','');

    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_WIDE'; // 13.33 x 7.5 인치

    for (const slide of slides) {
      const s = pptx.addSlide();

      // 배경
      if (bgDataUrl) {
        s.background = { data: bgDataUrl };
      } else {
        s.background = { color: bgCol || '111111' };
      }

      // 성경 구절 (상단, 오른쪽 정렬)
      if (slide.verse) {
        s.addText(slide.verse, {
          x: 0.4, y: 0.25, w: 12.5, h: 1.3,
          fontSize: versePt,
          fontFace: font,
          color: verseCol,
          bold: true,
          align: 'right',
          valign: 'top',
          lineSpacingMultiple: spacing,
          wrap: true,
        });
      }

      // 본문 (하단, 오른쪽 정렬)
      if (slide.body.length > 0) {
        // 각 줄을 별도 텍스트 런(run)으로 생성 (줄바꿈 정확히 처리)
        const runs = [];
        slide.body.forEach((line, idx) => {
          runs.push({
            text: line,
            options: { breakLine: idx < slide.body.length - 1 }
          });
        });

        s.addText(runs, {
          x: 0.4, y: 1.7, w: 12.5, h: 5.5,
          fontSize: bodyPt,
          fontFace: font,
          color: bodyCol,
          align: 'right',
          valign: 'bottom',
          lineSpacingMultiple: spacing,
          wrap: true,
        });
      }
    }

    await pptx.writeFile({ fileName: 'bible_slides.pptx' });
  }

  // 초기 렌더
  updatePreview();
  // 창 크기 변경 시 폰트 스케일 재계산
  window.addEventListener('resize', updatePreview);
</script>
</body>
</html>
